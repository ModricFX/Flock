name: Build and Deploy API and Web

on:
  push:
    branches:
      - '**'

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: self-hosted
    env:
      CI: false

    steps:
      ### CHECKOUT REPO ###
      - name: Checkout code
        uses: actions/checkout@v3

      ### SET UP NODE.JS AND CACHE DEPENDENCIES FOR WEB ###
      - name: Use Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Cache npm dependencies
        id: npm-cache
        uses: actions/cache@v3
        with:
          path: Web/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('Web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      ### INSTALL DEPENDENCIES FOR WEB ###
      - name: Install dependencies (Web)
        if: steps.npm-cache.outputs.cache-hit != 'true'
        working-directory: Web
        run: npm ci

      ### VERIFY AND COPY ENV FILE ###
      - name: Verify and Copy .env File
        run: |
          if [ ! -f /flock/.env ]; then
            echo "Error: /flock/.env not found."
            exit 1
          fi
          cp /flock/.env Web/.env
        shell: bash

      ### BUILD WEB ###
      - name: Build Web
        working-directory: Web
        run: npm run build

      ### RESTORE, BUILD, AND PUBLISH API ###
      - name: Restore API dependencies
        working-directory: API
        run: dotnet restore

      - name: Build and Publish API
        working-directory: API
        run: dotnet publish -c Release -o /flock/api

      ### DEPLOY WEB ###
      - name: Deploy Web
        run: |
          echo "Deploying Web to /var/www/flock/"
          sudo rm -rf /var/www/flock/
          sudo mkdir -p /var/www/flock/
          sudo cp -r Web/dist/* /var/www/flock/
          echo "Web deployment completed."

      ### COPY APPSETTINGS.JSON ###
      - name: Copy appsettings.json
        run: |
          echo "Copying production appsettings to /flock/api"
          sudo cp /flock/appsettings.json /flock/api/

      ### RESTART API SERVICE ###
      - name: Deploy API
        run: |
          echo "Restarting flock-api.service..."
          sudo systemctl daemon-reload
          sudo systemctl restart flock-api.service
          echo "API service restarted successfully."
